spring:
  application:
    name: ai-code-app
  # session 配置
  session:
    store-type: redis
    timeout: 2592000
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_code_mother
    username: root
    password: wbq1518
  # redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ttl: 3600
      database: ${REDIS_DATABASE:0}

server:
  port: 8125
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_API_KEY:}
      model-name: ${LLM_CHAT_MODEL_NAME:deepseek-v4-flash}
      strict-json-schema: true
      response-format: json
      max-tokens: 8192
      max-retries: 3
      log-requests: true
      log-responses: true
    streaming-chat-model:
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_API_KEY:}
      model-name: ${LLM_STREAMING_MODEL_NAME:deepseek-v4-pro}
      max-tokens: 16384
      timeout: 300s
      log-requests: true
      log-responses: true
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_API_KEY:}
      model-name: ${LLM_REASONING_MODEL_NAME:deepseek-v4-pro}
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
      api-key: ${LLM_API_KEY:}
      model-name: ${LLM_ROUTING_MODEL_NAME:deepseek-v4-flash}
      log-requests: true
      log-responses: true

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.wbq.aicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
