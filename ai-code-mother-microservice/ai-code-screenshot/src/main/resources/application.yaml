spring:
  application:
    name: ai-code-screenshot
server:
  port: 8127
  servlet:
    context-path: /api
# COS 对象存储配置
cos:
  client:
    host: ${COS_HOST:}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-beijing}
    bucket: ${COS_BUCKET:}
# Dubbo
dubbo:
  registry:
    address: nacos://127.0.0.1:8848?username=nacos&password=nacos
    register-mode: instance
  protocol:
    name: tri
    port: 50052
  consumer:
    timeout: 120000
  provider:
    timeout: 120000
  application:
    qos-enable: false

